# OpenWrt: 若 dnsmasq 管理局域网 DNS，可将其上游指向 127.0.0.1#1053；须检查其 IPv6 RA/DHCPv6 DNS 下发。
# Mihomo Alpha (2026-10-25) / Sub-Store 覆写 / 直接运行 Mihomo 内核
# DNS 双栈的 IPv6 开启 ≠ 所有节点都拥有真实 IPv6 出口。
mode: rule
log-level: info
ipv6: true
find-process-mode: off
allow-lan: false
unified-delay: true
tcp-concurrent: true
# 管理端口默认仅 localhost 可访问，避免原版 0.0.0.0 + secret 空值暴露。
external-controller: 0.0.0.0:9090
secret: 'mihomo'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip'
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - 'Mijia Cloud'
    - '+.push.apple.com'

# OpenWrt 裸核：Linux 自动路由和自动重定向；避免和其它透明代理共用接管规则。
tun:
  enable: true
  stack: mips
  dns-hijack: ['any:53', 'tcp://any:53']
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  dns-mode: hijack
  inet6-address: ['fdfe:dcba:9876::1/126']

dns:
  listen: 127.0.0.1:1053
  enable: true
  cache-algorithm: arc
  ipv6: true
  respect-rules: true
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 'fdfe:dcba:9876::/64'
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,fakeipfilter_cn,real-ip
    - RULE-SET,fakeipfilter_!cn,real-ip
    - DOMAIN-SUFFIX,lan,real-ip
    - DOMAIN-SUFFIX,home.arpa,real-ip
    - RULE-SET,private_domain,real-ip
    - RULE-SET,cn_domain,real-ip
    - MATCH,fake-ip
  # 原版只为 bootstrap 使用明文解析。改为加密的 IP 字面量 DNS 减少此类泄露。
  default-nameserver:
    - 'tls://223.5.5.5'
    - 'tls://223.6.6.6'
  # 海外 DoH 强制走 DNS出口，而不跟随可能被设置为 DIRECT 的 Default。
  nameserver:
    - 'https://1.1.1.1/dns-query#DNS出口'
    - 'https://8.8.8.8/dns-query#DNS出口'
  nameserver-policy:
    # 本地局域网名字交给 dnsmasq（路由器 127.0.0.1:53）。
    # 若 dnsmasq 对这些域名未提供本地权威解析，可能产生转发环路，请排查。
    '+.lan': '127.0.0.1:53'
    '+.home.arpa': '127.0.0.1:53'
    'rule-set:cn_domain': &cn_dns
      - 'https://dns.alidns.com/dns-query#DIRECT&disable-qtype-65=true'
      - 'https://doh.pub/dns-query#DIRECT&disable-qtype-65=true'
    'rule-set:fakeipfilter_cn': *cn_dns
    'rule-set:samsung_domain': *cn_dns
    'rule-set:microsoftcn_domain': *cn_dns
    'rule-set:applecn_domain': *cn_dns
    'rule-set:steamcn_domain': *cn_dns
  proxy-server-nameserver:
    - 'tls://223.5.5.5#DIRECT'
    - 'tls://223.6.6.6#DIRECT'
  direct-nameserver: *cn_dns
  direct-nameserver-follow-policy: true

proxy-groups:
  - name: DNS出口
    type: select
    proxies: [自动选择, 故障转移]
    hidden: true

  - name: Default
    type: select
    proxies: [自动选择, 故障转移, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 全部节点, DIRECT]

  - name: 其他
    type: select
    proxies: [Default, DIRECT, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 自动选择, 故障转移, 全部节点]

  # AI-Serve 是规则使用的总入口；AI 为过滤掉不适合 AI 的订阅/节点后的候选池
  - name: AI-Serve
    type: select
    proxies: [AI, 美国, 日本, 新加坡, 台湾, 其他地区]

  - name: AI
    type: select
    proxies: [AI-稳定, AI-自动]
    include-all-proxies: true
    exclude-filter: &a_sv '(?i)^\[L\]|^\[K\].*(香港|香江|Hong Kong|🇭🇰)|^\[N\].*(香港|香江|🇭🇰|流量|双鱼座)'

  # 通用服务组
  - name: YouTube
    <<: &svc
      type: select
      proxies: [Default, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 自动选择, 故障转移, 全部节点, DIRECT]
  - name: Google
    <<: *svc
  - name: GitHub
    <<: *svc
  - name: Telegram
    <<: *svc
  - name: TikTok
    <<: *svc
  - name: NETFLIX
    <<: *svc
  - name: Wallet
    <<: *svc
  - name: Steam
    <<: *svc

  # 国内网络优先直连的服务组
  - name: OneDrive
    <<: &svc_direct
      type: select
      proxies: [DIRECT, Default, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 自动选择, 故障转移, 全部节点]
  - name: Microsoft
    <<: *svc_direct
  - name: Apple
    <<: *svc_direct

  # 全局自动测速 / 故障转移。fallback 按候选顺序选择可用节点，不保证粘性出口 IP。
  - name: 自动选择
    <<: &auto
      type: url-test
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 600
      timeout: 5000
      tolerance: 100
      max-failed-times: 3
      lazy: true
      hidden: true
      empty-fallback: REJECT
      include-all-proxies: true
    hidden: false

  - name: 故障转移
    <<: &stable
      type: fallback
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      max-failed-times: 3
      lazy: true
      hidden: true
      empty-fallback: REJECT
      include-all-proxies: true
    hidden: false

  - name: 全部节点
    type: select
    include-all-proxies: true

  # 地区主组：可选自动、故障转移或手动指定的地区节点
  - name: 香港
    type: select
    proxies: [香港-稳定, 香港-自动]
    include-all-proxies: true
    filter: &f_hk '(?i)香港|港|\bHK\b|hong ?kong|🇭🇰'

  - name: 台湾
    type: select
    proxies: [台湾-稳定, 台湾-自动]
    include-all-proxies: true
    filter: &f_tw '(?i)台湾|台灣|台北|\bTW\b|taiwan|🇹🇼'

  - name: 日本
    type: select
    proxies: [日本-稳定, 日本-自动]
    include-all-proxies: true
    filter: &f_jp '(?i)日本|东京|大阪|\bJP\b|japan|tokyo|osaka|🇯🇵'

  - name: 新加坡
    type: select
    proxies: [新加坡-稳定, 新加坡-自动]
    include-all-proxies: true
    filter: &f_sg '(?i)新加坡|狮城|\bSG\b|singapore|🇸🇬'

  - name: 美国
    type: select
    proxies: [美国-稳定, 美国-自动]
    include-all-proxies: true
    filter: &f_us '(?i)美国|美國|\bUS\b|\bUSA\b|united states|america|🇺🇸'

  - name: 其他地区
    type: select
    proxies: [其他地区-稳定, 其他地区-自动]
    exclude-filter: &f_ot '(?i)剩余|流量|到期|套餐|官网|订阅|重置|过期|香港|港|\bHK\b|hong ?kong|🇭🇰|台湾|台灣|台北|\bTW\b|taiwan|🇹🇼|日本|东京|大阪|\bJP\b|japan|tokyo|osaka|🇯🇵|新加坡|狮城|\bSG\b|singapore|🇸🇬|美国|美國|\bUS\b|\bUSA\b|united states|america|🇺🇸'

  # 隐藏辅助组：只在对应主组内部使用
  - name: AI-自动
    <<: *auto
    exclude-filter: *a_sv
  - name: AI-稳定
    <<: *stable
    exclude-filter: *a_sv

  - name: 香港-自动
    <<: *auto
    filter: *f_hk
  - name: 香港-稳定
    <<: *stable
    filter: *f_hk
  - name: 台湾-自动
    <<: *auto
    filter: *f_tw
  - name: 台湾-稳定
    <<: *stable
    filter: *f_tw
  - name: 日本-自动
    <<: *auto
    filter: *f_jp
  - name: 日本-稳定
    <<: *stable
    filter: *f_jp
  - name: 新加坡-自动
    <<: *auto
    filter: *f_sg
  - name: 新加坡-稳定
    <<: *stable
    filter: *f_sg
  - name: 美国-自动
    <<: *auto
    filter: *f_us
  - name: 美国-稳定
    <<: *stable
    filter: *f_us
  - name: 其他地区-自动
    <<: *auto
    exclude-filter: *f_ot
  - name: 其他地区-稳定
    <<: *stable
    exclude-filter: *f_ot

rules:
  # 可选的 QUIC 限制：拒绝非 CN 域名的 UDP/443，促使应用回退到 TCP
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,samsung_domain,DIRECT
  - RULE-SET,ai_domain,AI-Serve
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,github_domain,GitHub
  - RULE-SET,onedrive_domain,OneDrive
  - RULE-SET,microsoftcn_domain,DIRECT
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,apple_domain,Apple
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,paypal_domain,Wallet
  - RULE-SET,binance_domain,Wallet
  - RULE-SET,okx_domain,Wallet
  - RULE-SET,usd_domain,Wallet
  - RULE-SET,steamcn_domain,DIRECT
  - RULE-SET,steam_domain,Steam
  - RULE-SET,cn!_domain,Default
  # IP 规则加 no-resolve，避免为命中 IP 集合而额外触发域名解析
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,apple_ip,Apple,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,netflix_ip,NETFLIX,no-resolve
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT,no-resolve
  - MATCH,其他

# 规则集模板锚点（Mihomo 示例配置采用同类写法）
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}

rule-providers:

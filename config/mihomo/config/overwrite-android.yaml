# Mihomo Alpha 覆写模板：Android 手机
# 不包含 proxies / proxy-providers；请与 Sub-Store 生成的节点配置合并使用。
# 先确认客户端随附内核支持本模板字段；Android 客户端可能会覆盖 TUN/VPN 设置。
# 建议 Android 系统“私人 DNS”设为关闭，以便验证 DNS 劫持与规则策略是否生效。

mode: rule
log-level: info
ipv6: true
unified-delay: true

profile:
  store-selected: true
  store-fake-ip: true

# 嗅探：帮助硬编码 IP / 缓存 IP 连接恢复域名信息
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# Android 通常由客户端 VPNService 创建 TUN；不要照搬 Linux 路由器的 auto-redirect
# 如果某应用与 mips 栈不兼容，再将 stack 改为 system 做对照测试
tun:
  enable: true
  stack: mips
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  inet6-address: [fdfe:dcba:9876::1/126]
  # 需要排除特定应用时，可在此处设置 exclude-package；注意客户端自身可能另有分应用设置
  # exclude-package:
  #   - com.android.captiveportallogin

dns:
  enable: true
  cache-algorithm: arc
  # 明确关闭 AAAA 应答；顶层 ipv6: true 仍允许内核接收/处理 IPv6 流量
  ipv6: false
  respect-rules: true
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,fakeipfilter_cn,real-ip
    - RULE-SET,fakeipfilter_!cn,real-ip
    - RULE-SET,private_domain,real-ip
    - RULE-SET,cn_domain,real-ip
    - MATCH,fake-ip

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - "https://1.1.1.1/dns-query#RULES&disable-qtype-65=true"
    - "https://8.8.8.8/dns-query#RULES&disable-qtype-65=true"

  nameserver-policy:
    # 手机不依赖系统 DNS 解析局域网主机名；内网服务优先用 IP 或 hosts 映射
    "rule-set:private_domain": &cn_dns
      - "https://dns.alidns.com/dns-query#DIRECT&disable-qtype-65=true"
      - "https://doh.pub/dns-query#DIRECT&disable-qtype-65=true"
    "rule-set:cn_domain": *cn_dns
    "rule-set:fakeipfilter_cn": *cn_dns
    "rule-set:samsung_domain": *cn_dns
    "rule-set:microsoftcn_domain": *cn_dns
    "rule-set:applecn_domain": *cn_dns
    "rule-set:steamcn_domain": *cn_dns

  proxy-server-nameserver: *cn_dns
  direct-nameserver: *cn_dns
  direct-nameserver-follow-policy: true

proxy-groups:
  - name: Default
    type: select
    proxies: [自动选择, 故障转移, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 全部节点, DIRECT]

  - name: 其他
    type: select
    proxies: [Default, DIRECT, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 自动选择, 故障转移, 全部节点]

  - name: AI-Serve
    type: select
    proxies: [AI, 美国, 日本, 新加坡, 台湾, 其他地区]

  - name: AI
    type: select
    proxies: [AI-自动, AI-稳定]
    include-all-proxies: true
    exclude-filter: &a_sv '(?i)^\[L\]|^\[K\].*(香港|香江|Hong Kong|🇭🇰)|^\[N\].*(香港|香江|🇭🇰|流量|双鱼座)'

  - name: YouTube
    <<: &svc
      type: select
      proxies: [Default, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 自动选择, 故障转移, 全部节点, DIRECT]
  - name: Google
    <<: *svc
  - name: GitHub
    <<: *svc
  - name: Telegram
    <<: *svc
  - name: TikTok
    <<: *svc
  - name: NETFLIX
    <<: *svc
  - name: Wallet
    <<: *svc
  - name: Steam
    <<: *svc

  - name: OneDrive
    <<: &svc_direct
      type: select
      proxies: [DIRECT, Default, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 自动选择, 故障转移, 全部节点]
  - name: Microsoft
    <<: *svc_direct
  - name: Apple
    <<: *svc_direct

  - name: 自动选择
    <<: &auto
      type: url-test
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 600
      timeout: 5000
      tolerance: 100
      max-failed-times: 3
      lazy: true
      hidden: true
      include-all-proxies: true
    hidden: false

  - name: 故障转移
    <<: &stable
      type: fallback
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      max-failed-times: 3
      lazy: true
      hidden: true
      include-all-proxies: true
    hidden: false

  - name: 全部节点
    type: select
    include-all-proxies: true

  - name: 香港
    type: select
    proxies: [香港-自动, 香港-稳定]
    include-all-proxies: true
    filter: &f_hk '(?i)香港|港|\bHK\b|hong ?kong|🇭🇰'

  - name: 台湾
    type: select
    proxies: [台湾-自动, 台湾-稳定]
    include-all-proxies: true
    filter: &f_tw '(?i)台湾|台灣|台北|\bTW\b|taiwan|🇹🇼'

  - name: 日本
    type: select
    proxies: [日本-自动, 日本-稳定]
    include-all-proxies: true
    filter: &f_jp '(?i)日本|东京|大阪|\bJP\b|japan|tokyo|osaka|🇯🇵'

  - name: 新加坡
    type: select
    proxies: [新加坡-自动, 新加坡-稳定]
    include-all-proxies: true
    filter: &f_sg '(?i)新加坡|狮城|\bSG\b|singapore|🇸🇬'

  - name: 美国
    type: select
    proxies: [美国-自动, 美国-稳定]
    include-all-proxies: true
    filter: &f_us '(?i)美国|美國|\bUS\b|\bUSA\b|united states|america|🇺🇸'

  - name: 其他地区
    type: select
    proxies: [其他地区-自动, 其他地区-稳定]
    include-all-proxies: true
    exclude-filter: &f_ot '(?i)剩余|流量|到期|套餐|官网|订阅|重置|过期|香港|港|\bHK\b|hong ?kong|🇭🇰|台湾|台灣|台北|\bTW\b|taiwan|🇹🇼|日本|东京|大阪|\bJP\b|japan|tokyo|osaka|🇯🇵|新加坡|狮城|\bSG\b|singapore|🇸🇬|美国|美國|\bUS\b|\bUSA\b|united states|america|🇺🇸'

  - name: AI-自动
    <<: *auto
    exclude-filter: *a_sv
  - name: AI-稳定
    <<: *stable
    exclude-filter: *a_sv

  - name: 香港-自动
    <<: *auto
    filter: *f_hk
  - name: 香港-稳定
    <<: *stable
    filter: *f_hk
  - name: 台湾-自动
    <<: *auto
    filter: *f_tw
  - name: 台湾-稳定
    <<: *stable
    filter: *f_tw
  - name: 日本-自动
    <<: *auto
    filter: *f_jp
  - name: 日本-稳定
    <<: *stable
    filter: *f_jp
  - name: 新加坡-自动
    <<: *auto
    filter: *f_sg
  - name: 新加坡-稳定
    <<: *stable
    filter: *f_sg
  - name: 美国-自动
    <<: *auto
    filter: *f_us
  - name: 美国-稳定
    <<: *stable
    filter: *f_us
  - name: 其他地区-自动
    <<: *auto
    exclude-filter: *f_ot
  - name: 其他地区-稳定
    <<: *stable
    exclude-filter: *f_ot

rules:
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,samsung_domain,DIRECT
  - RULE-SET,ai_domain,AI-Serve
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,github_domain,GitHub
  - RULE-SET,onedrive_domain,OneDrive
  - RULE-SET,microsoftcn_domain,DIRECT
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,apple_domain,Apple
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,paypal_domain,Wallet
  - RULE-SET,binance_domain,Wallet
  - RULE-SET,okx_domain,Wallet
  - RULE-SET,usd_domain,Wallet
  - RULE-SET,steamcn_domain,DIRECT
  - RULE-SET,steam_domain,Steam
  - RULE-SET,cn!_domain,Default
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,apple_ip,Apple,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,netflix_ip,NETFLIX,no-resolve
  - RULE-SET,cn_ip,DIRECT,no-resolve
  - MATCH,其他

rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}


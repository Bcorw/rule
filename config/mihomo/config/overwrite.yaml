# Mihomo Alpha 覆写模板：Linux / OpenWrt 路由器
# 不包含 proxies / proxy-providers；请与 Sub-Store 生成的节点配置合并使用。
# 健康检查按需触发，降低 N60Pro 等资源受限设备的后台探测开销。

# 全局
mode: rule
log-level: info
ipv6: true
unified-delay: true
find-process-mode: off

# 控制器监听所有接口供局域网面板访问；部署前必须替换为自己的随机密钥，
# 并通过路由器防火墙限制 9060 端口仅 LAN 可访问。
external-controller: 0.0.0.0:9060
secret: "hmibdmXvYws1rjeXd_3hELLDPvk2oriknhacq0pDLk-GOZbz"
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

profile:
  store-selected: true
  store-fake-ip: true

# 嗅探：帮助纯 IP 连接恢复域名信息；不全局覆写目标地址
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# Linux 路由器 TUN：auto-redirect 仅适用于 Linux，且依赖 auto-route
# 如 strict-route 影响本地网段访问或其他 VPN，再针对实际网络调整
tun:
  enable: true
  stack: mips
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  inet6-address: [fdfe:dcba:9876::1/126]

dns:
  enable: true
  cache-algorithm: arc
  # 顶层 ipv6 仍允许内核处理 IPv6；DNS 对 AAAA 返回空解析，以减少常见应用绕过 IPv4 代理策略的情况
  ipv6: false
  respect-rules: true
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 按规则决定返回真实 IP 还是 Fake-IP；最后一条必须是 MATCH
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,fakeipfilter_cn,real-ip
    - RULE-SET,fakeipfilter_!cn,real-ip
    - RULE-SET,private_domain,real-ip
    - RULE-SET,cn_domain,real-ip
    - MATCH,fake-ip

  # 仅用于引导解析 DoH 服务器域名；必须使用 IP 地址
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 境外 DoH 按路由规则出站；使用 IP 地址避免 DoH 域名自身的引导解析循环
  nameserver:
    - "https://1.1.1.1/dns-query#RULES&disable-qtype-65=true"
    - "https://8.8.8.8/dns-query#RULES&disable-qtype-65=true"

  nameserver-policy:
    # OpenWrt 本地域名交由系统解析。若系统 DNS 又把这些查询转发回 Mihomo，需改为实际 LAN DNS 地址以避免循环。
    "rule-set:private_domain": system
    "rule-set:cn_domain": &cn_dns
      - "https://dns.alidns.com/dns-query#DIRECT&disable-qtype-65=true"
      - "https://doh.pub/dns-query#DIRECT&disable-qtype-65=true"
    "rule-set:fakeipfilter_cn": *cn_dns
    "rule-set:samsung_domain": *cn_dns
    "rule-set:microsoftcn_domain": *cn_dns
    "rule-set:applecn_domain": *cn_dns
    "rule-set:steamcn_domain": *cn_dns

  # 代理节点域名使用国内引导解析；DIRECT 连接的 DNS 遵守 nameserver-policy
  proxy-server-nameserver: *cn_dns
  direct-nameserver: *cn_dns
  direct-nameserver-follow-policy: true

proxy-groups:
  - name: Default
    type: select
    proxies: [自动选择, 故障转移, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 全部节点, DIRECT]

  - name: 其他
    type: select
    proxies: [Default, DIRECT, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 自动选择, 故障转移, 全部节点]

  # AI-Serve 是规则使用的总入口；AI 为过滤掉不适合 AI 的订阅/节点后的候选池
  - name: AI-Serve
    type: select
    proxies: [AI, 美国, 日本, 新加坡, 台湾, 其他地区]

  - name: AI
    type: select
    proxies: [AI-自动, AI-稳定]
    include-all-proxies: true
    exclude-filter: &a_sv '(?i)^\[L\]|^\[K\].*(香港|香江|Hong Kong|🇭🇰)|^\[N\].*(香港|香江|🇭🇰|流量|双鱼座)'

  # 通用服务组
  - name: YouTube
    <<: &svc
      type: select
      proxies: [Default, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 自动选择, 故障转移, 全部节点, DIRECT]
  - name: Google
    <<: *svc
  - name: GitHub
    <<: *svc
  - name: Telegram
    <<: *svc
  - name: TikTok
    <<: *svc
  - name: NETFLIX
    <<: *svc
  - name: Wallet
    <<: *svc
  - name: Steam
    <<: *svc

  # 国内网络优先直连的服务组
  - name: OneDrive
    <<: &svc_direct
      type: select
      proxies: [DIRECT, Default, 香港, 台湾, 日本, 新加坡, 美国, 其他地区, 自动选择, 故障转移, 全部节点]
  - name: Microsoft
    <<: *svc_direct
  - name: Apple
    <<: *svc_direct

  # 全局自动测速 / 故障转移。fallback 按候选顺序选择可用节点，不保证粘性出口 IP。
  - name: 自动选择
    <<: &auto
      type: url-test
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 600
      timeout: 5000
      tolerance: 100
      max-failed-times: 3
      lazy: true
      hidden: true
      include-all-proxies: true
    hidden: false

  - name: 故障转移
    <<: &stable
      type: fallback
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 300
      timeout: 5000
      max-failed-times: 3
      lazy: true
      hidden: true
      include-all-proxies: true
    hidden: false

  - name: 全部节点
    type: select
    include-all-proxies: true

  # 地区主组：可选自动、故障转移或手动指定的地区节点
  - name: 香港
    type: select
    proxies: [香港-自动, 香港-稳定]
    include-all-proxies: true
    filter: &f_hk '(?i)香港|港|\bHK\b|hong ?kong|🇭🇰'

  - name: 台湾
    type: select
    proxies: [台湾-自动, 台湾-稳定]
    include-all-proxies: true
    filter: &f_tw '(?i)台湾|台灣|台北|\bTW\b|taiwan|🇹🇼'

  - name: 日本
    type: select
    proxies: [日本-自动, 日本-稳定]
    include-all-proxies: true
    filter: &f_jp '(?i)日本|东京|大阪|\bJP\b|japan|tokyo|osaka|🇯🇵'

  - name: 新加坡
    type: select
    proxies: [新加坡-自动, 新加坡-稳定]
    include-all-proxies: true
    filter: &f_sg '(?i)新加坡|狮城|\bSG\b|singapore|🇸🇬'

  - name: 美国
    type: select
    proxies: [美国-自动, 美国-稳定]
    include-all-proxies: true
    filter: &f_us '(?i)美国|美國|\bUS\b|\bUSA\b|united states|america|🇺🇸'

  - name: 其他地区
    type: select
    proxies: [其他地区-自动, 其他地区-稳定]
    include-all-proxies: true
    exclude-filter: &f_ot '(?i)剩余|流量|到期|套餐|官网|订阅|重置|过期|香港|港|\bHK\b|hong ?kong|🇭🇰|台湾|台灣|台北|\bTW\b|taiwan|🇹🇼|日本|东京|大阪|\bJP\b|japan|tokyo|osaka|🇯🇵|新加坡|狮城|\bSG\b|singapore|🇸🇬|美国|美國|\bUS\b|\bUSA\b|united states|america|🇺🇸'

  # 隐藏辅助组：只在对应主组内部使用
  - name: AI-自动
    <<: *auto
    exclude-filter: *a_sv
  - name: AI-稳定
    <<: *stable
    exclude-filter: *a_sv

  - name: 香港-自动
    <<: *auto
    filter: *f_hk
  - name: 香港-稳定
    <<: *stable
    filter: *f_hk
  - name: 台湾-自动
    <<: *auto
    filter: *f_tw
  - name: 台湾-稳定
    <<: *stable
    filter: *f_tw
  - name: 日本-自动
    <<: *auto
    filter: *f_jp
  - name: 日本-稳定
    <<: *stable
    filter: *f_jp
  - name: 新加坡-自动
    <<: *auto
    filter: *f_sg
  - name: 新加坡-稳定
    <<: *stable
    filter: *f_sg
  - name: 美国-自动
    <<: *auto
    filter: *f_us
  - name: 美国-稳定
    <<: *stable
    filter: *f_us
  - name: 其他地区-自动
    <<: *auto
    exclude-filter: *f_ot
  - name: 其他地区-稳定
    <<: *stable
    exclude-filter: *f_ot

rules:
  # 可选的 QUIC 限制：拒绝非 CN 域名的 UDP/443，促使应用回退到 TCP
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,samsung_domain,DIRECT
  - RULE-SET,ai_domain,AI-Serve
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,github_domain,GitHub
  - RULE-SET,onedrive_domain,OneDrive
  - RULE-SET,microsoftcn_domain,DIRECT
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,apple_domain,Apple
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,paypal_domain,Wallet
  - RULE-SET,binance_domain,Wallet
  - RULE-SET,okx_domain,Wallet
  - RULE-SET,usd_domain,Wallet
  - RULE-SET,steamcn_domain,DIRECT
  - RULE-SET,steam_domain,Steam
  - RULE-SET,cn!_domain,Default
  # IP 规则加 no-resolve，避免为命中 IP 集合而额外触发域名解析
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,apple_ip,Apple,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,netflix_ip,NETFLIX,no-resolve
  - RULE-SET,cn_ip,DIRECT,no-resolve
  - MATCH,其他

# 规则集模板锚点（Mihomo 示例配置采用同类写法）
